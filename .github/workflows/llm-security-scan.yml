# =============================================================================
# SentinelLoop CI/CD LLM Security Guardrail Workflow
# =============================================================================
# This GitHub Action triggers a SentinelLoop scan on every push/PR, polls the
# result, and fails the build if critical or high vulnerabilities are found.
#
# SETUP INSTRUCTIONS:
# 1. Register target in SentinelLoop & verify ownership.
# 2. Generate a CI API Key (POST /api/v1/api-keys/).
# 3. Add to GitHub Repo Settings -> Secrets -> Actions:
#      - SENTINELLOOP_API_KEY: your generated api key.
#      - SENTINELLOOP_TARGET_ID: your target chatbot UUID.
#      - SENTINELLOOP_URL: the base URL of your SentinelLoop instance (e.g. https://sentinel.mycompany.com).
# =============================================================================

name: SentinelLoop LLM Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-scan:
    name: LLM Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Trigger SentinelLoop Scan
      id: trigger_scan
      run: |
        if [ -z "${{ secrets.SENTINELLOOP_API_KEY }}" ]; then
          echo "ERROR: SENTINELLOOP_API_KEY secret is not set!"
          exit 1
        fi
        if [ -z "${{ secrets.SENTINELLOOP_TARGET_ID }}" ]; then
          echo "ERROR: SENTINELLOOP_TARGET_ID secret is not set!"
          exit 1
        fi
        
        SENTINEL_HOST="${{ secrets.SENTINELLOOP_URL }}"
        if [ -z "$SENTINEL_HOST" ]; then
          SENTINEL_HOST="http://localhost:8000" # fallback
        fi
        
        echo "Triggering scan for target: ${{ secrets.SENTINELLOOP_TARGET_ID }}..."
        RESPONSE=$(curl -s -X POST \
          -H "X-API-Key: ${{ secrets.SENTINELLOOP_API_KEY }}" \
          -H "Content-Type: application/json" \
          "$SENTINEL_HOST/api/v1/scans/ci?target_id=${{ secrets.SENTINELLOOP_TARGET_ID }}&commit_sha=${{ github.sha }}")
        
        echo "Response: $RESPONSE"
        SCAN_ID=$(echo "$RESPONSE" | jq -r '.scan_id')
        
        if [ "$SCAN_ID" = "null" ] || [ -z "$SCAN_ID" ]; then
          echo "ERROR: Failed to trigger scan. Response did not contain scan_id."
          exit 1
        fi
        
        echo "Scan triggered successfully. Scan ID: $SCAN_ID"
        echo "scan_id=$SCAN_ID" >> $GITHUB_OUTPUT
        echo "sentinel_host=$SENTINEL_HOST" >> $GITHUB_OUTPUT

    - name: Poll Scan Progress
      id: poll_scan
      run: |
        SCAN_ID="${{ steps.trigger_scan.outputs.scan_id }}"
        SENTINEL_HOST="${{ steps.trigger_scan.outputs.sentinel_host }}"
        
        echo "Polling scan $SCAN_ID progress..."
        
        # Max wait: 15 minutes (90 iterations * 10 seconds)
        MAX_ITERATIONS=90
        INTERVAL=10
        
        for ((i=1; i<=MAX_ITERATIONS; i++)); do
          STATUS_RESPONSE=$(curl -s "$SENTINEL_HOST/api/v1/scans/$SCAN_ID")
          STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status')
          COMPLETED=$(echo "$STATUS_RESPONSE" | jq -r '.completed_attacks')
          TOTAL=$(echo "$STATUS_RESPONSE" | jq -r '.total_attacks')
          
          echo "[$i/$MAX_ITERATIONS] Status: $STATUS ($COMPLETED/$TOTAL attacks completed)"
          
          if [ "$STATUS" = "done" ]; then
            echo "Scan completed successfully."
            break
          elif [ "$STATUS" = "failed" ]; then
            echo "ERROR: SentinelLoop scan task failed on server."
            exit 1
          fi
          
          if [ $i -eq $MAX_ITERATIONS ]; then
            echo "ERROR: Scan polling timed out."
            exit 1
          fi
          
          sleep $INTERVAL
        done

    - name: Evaluate Security Gate
      run: |
        SCAN_ID="${{ steps.trigger_scan.outputs.scan_id }}"
        SENTINEL_HOST="${{ steps.trigger_scan.outputs.sentinel_host }}"
        
        STATUS_RESPONSE=$(curl -s "$SENTINEL_HOST/api/v1/scans/$SCAN_ID")
        
        # Extract findings count by severity using jq
        CRITICAL_COUNT=$(echo "$STATUS_RESPONSE" | jq '[.findings[] | select(.severity == "critical")] | length')
        HIGH_COUNT=$(echo "$STATUS_RESPONSE" | jq '[.findings[] | select(.severity == "high")] | length')
        MEDIUM_COUNT=$(echo "$STATUS_RESPONSE" | jq '[.findings[] | select(.severity == "medium")] | length')
        LOW_COUNT=$(echo "$STATUS_RESPONSE" | jq '[.findings[] | select(.severity == "low")] | length')
        
        echo "=== SENTINELLOOP SECURITY GATE AUDIT ==="
        echo "Critical Vulnerabilities: $CRITICAL_COUNT"
        echo "High Vulnerabilities:     $HIGH_COUNT"
        echo "Medium Vulnerabilities:   $MEDIUM_COUNT"
        echo "Low Vulnerabilities:      $LOW_COUNT"
        echo "========================================"
        
        # Enforce gate: fail if any Critical or High vulnerabilities are found
        if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
          echo "❌ SECURITY GATE FAILED: Found $CRITICAL_COUNT critical and $HIGH_COUNT high LLM vulnerabilities."
          echo "Please deploy the suggested code-level patches before merging."
          exit 1
        fi
        
        echo "✅ SECURITY GATE PASSED: No Critical or High vulnerabilities found."
